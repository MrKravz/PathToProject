name: CI - Company Service

on:
  push:
    branches: [ master, develop ]
    paths:
      - 'CompanyService/**'
      - '.github/workflows/ci-company-service.yaml'
  pull_request:
    branches: [ master, develop ]
    paths:
      - 'CompanyService/**'
      - '.github/workflows/ci-company-service.yaml'

jobs:
  build-test-analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build, Test & Sonar
        working-directory: CompanyService
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn clean verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=MrKravz_company-service \
            -Dsonar.organization=mrkravz \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.coverage.exclusions=**/config/**,**/dto/**,**/model/**,**/exception/**,**/repository/**,**/mapper/**,**/*Application.java,**/util/**,**/client/**

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: build-test-analyze
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: CompanyService
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/company-service:latest