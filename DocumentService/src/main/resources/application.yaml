server:
  port: 8084
spring:
  application:
    name: DocumentService
  threads:
    virtual:
      enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_SERVER}
    listener:
      concurrency: 3
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      group-id: document-group-id-v1
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: false
        spring.json.value.default.type: "by.ares.document_service.dto.PathListDto"


  mongodb:
    uri: ${MONGODB_URI}
    representation:
      uuid: standard

document-service:
  document:
    location: ${DOCUMENT_LOCATION:classpath:static/Путевой лист *.*}
    target-directory: ${DOCUMENT_TARGET_DIRECTORY:C:/Projects/DocFolder}