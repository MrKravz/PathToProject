server:
  port: 8084
spring:
  application:
    name: DocumentService
  threads:
    virtual:
      enabled: true
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
        group:
          enabled: true

  kafka:
    bootstrap-servers: ${KAFKA_SERVER}
    listener:
      concurrency: 3
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      group-id: document-group-id-v1
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: false
        spring.json.value.default.type: "by.ares.document_service.dto.PathListEventDto"

  mongodb:
    uri: ${MONGODB_URI}
    representation:
      uuid: standard

feign:
  client:
    company:
      url: ${COMPANY_SERVICE_URL}

resilience4j.circuitbreaker:
  instances:
    company-read-client:
      slidingWindowSize: 10
      failureRateThreshold: 50
      waitDurationInOpenState: 10000
    default:
      ignoreExceptions:
        - by.ares.document_service.exception.ApiException
resilience4j.retry:
  instances:
    company-read-client:
      maxAttempts: 5
      waitDuration: 500ms
      retryExceptions:
        - by.ares.document_service.exception.ApiTimeoutException
resilience4j.bulkhead:
  instances:
    company-read-client:
      maxConcurrentCalls: 5

document-service:
  document:
    location: ${DOCUMENT_LOCATION:classpath:static/Путевой лист *.*}
    target-directory: ${DOCUMENT_TARGET_DIRECTORY:C:/Projects/DocFolder}