server:
  port: 0

spring:
  application:
    name: DocumentService
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
        group:
          enabled: true
  threads:
    virtual:
      enabled: true
  datasource:

feign:
  client:
    company:
      url: "http://localhost:8081"

resilience4j.circuitbreaker:
  configs:
    default:
      slidingWindowSize: 5
      failureRateThreshold: 50
      waitDurationInOpenState: 1000
      ignoreExceptions:
        - by.ares.document_service.exception.ApiException
  instances:
    company-read-client:
      baseConfig: default

resilience4j.retry:
  configs:
    default:
      maxAttempts: 3
      waitDuration: 100ms
      retryExceptions:
        - by.ares.document_service.exception.ApiTimeoutException
  instances:
    company-read-client:
      baseConfig: default

resilience4j.bulkhead:
  configs:
    default:
      maxConcurrentCalls: 5
  instances:
    company-read-client:
      baseConfig: default