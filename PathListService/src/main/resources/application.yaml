server:
  port: 8082
spring:
  threads:
    virtual:
      enabled: true
  application:
    name: PathListService
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    jpa:
      properties:
        hibernate:
          show_sql: "true"
  data:
    redis:
      host: ${CACHE_HOST}
      port: 6379
      password: ${CACHE_PASSWORD}
      database: 0
      connect-timeout: 2000ms
      client-type: lettuce
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 2000ms
feign:
  client:
    company:
      url: "http://localhost:8081"
resilience4j.circuitbreaker:
  instances:
    default:
      ignoreExceptions:
        - by.ares.path_list_service.exception.ApiException
logging:
  level:
    by.ares.path_list_service.client: DEBUG