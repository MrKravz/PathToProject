server:
  port: 8082
spring:
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
  threads:
    virtual:
      enabled: true
  application:
    name: PathListService
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    jpa:
      properties:
        hibernate:
          show_sql: "true"
  data:
    redis:
      host: ${CACHE_HOST}
      port: 6379
      password: ${CACHE_PASSWORD}
      database: 0
      connect-timeout: 2000ms
      client-type: lettuce
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 2000ms
feign:
  client:
    company:
      url: ${COMPANY_SERVICE_URL}

resilience4j.circuitbreaker:
  instances:
    company-service:
      slidingWindowSize: 10
      failureRateThreshold: 50
      waitDurationInOpenState: 10000
    default:
      ignoreExceptions:
        - by.ares.path_list_service.exception.ApiException
resilience4j.retry:
  instances:
    company-service:
      maxAttempts: 5
      waitDuration: 500ms
      retryExceptions:
        - by.ares.path_list_service.exception.ApiTimeoutException
resilience4j.bulkhead:
  instances:
    company-service:
      maxConcurrentCalls: 5

outbox:
  topic-name: ${OUTBOX_TOPIC_NAME}