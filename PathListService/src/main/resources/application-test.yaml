server:
  port: 0

spring:
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
  threads:
    virtual:
      enabled: true
  application:
    name: PathListService
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/testdb
    username: test
    password: test
    jpa:
      properties:
        hibernate:
          show_sql: true
  data:
    redis:
      host: localhost
      port: 6379
      password: ""
      database: 0
      connect-timeout: 2000ms
      client-type: lettuce
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 2000ms

feign:
  client:
    company:
      url: "http://localhost:8081"

resilience4j.circuitbreaker:
  instances:
    company-service:
      slidingWindowSize: 5
      failureRateThreshold: 50
      waitDurationInOpenState: 1000
    default:
      ignoreExceptions:
        - by.ares.path_list_service.exception.ApiException

resilience4j.retry:
  instances:
    company-service:
      maxAttempts: 3
      waitDuration: 100ms
      retryExceptions:
        - by.ares.path_list_service.exception.ApiTimeoutException

resilience4j.bulkhead:
  instances:
    company-service:
      maxConcurrentCalls: 5