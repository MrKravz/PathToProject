spring:
  application:
    name: CompanyService
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    properties:
      hibernate:
        show_sql: "true"
  data:
    redis:
      host: ${CACHE_HOST}
      port: 6379
      password: ${CACHE_PASSWORD}
      database: 0
      connect-timeout: 2000ms
      client-type: lettuce
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 2000ms

server:
  port: 8081

